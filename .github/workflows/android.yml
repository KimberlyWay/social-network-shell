name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download sources
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and check APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon lintDebug assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: social-network-shell-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download sources
        uses: actions/checkout@v4
      - name: Download built APK
        uses: actions/download-artifact@v4
        with:
          name: social-network-shell-apk
          path: release
      - name: Prepare release files
        env:
          TAG: ${{ github.ref_name }}
        run: |
          mv release/app-debug.apk "release/social-network-shell-${TAG}.apk"
          git archive --format=zip --prefix=social-network-shell/ \
            --output="release/social-network-shell-source-${TAG}.zip" HEAD
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/*.apk release/*.zip \
            --verify-tag --title "Социальная сеть — ${TAG}" \
            --notes-file RELEASE_NOTES.md
